<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Category – Ai Edits Ram</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="wrap">
  <header class="top glass">
    <a class="brand" href="index.html">Ai Edits Ram</a>
    <div class="tools"><input type="search" id="q" placeholder="Search in this category…"><div class="seg"><button id="vg" class="on">Grid</button><button id="vl">List</button></div></div>
  </header>
  <nav class="chips" id="chips"></nav>
  <h1 id="heading"></h1>
  <main id="content"><div class="msg">Loading…</div></main>
</div>
<script src="assets/app.js"></script>
<script>
const {CATEGORIES,el,load,catUrl,viewUrl,card}=App;
const cat=CATEGORIES.find(c=>c.toLowerCase()===(new URLSearchParams(location.search).get('cat')||'').toLowerCase());
if(!cat)location.replace('index.html');
const content=document.getElementById('content'),heading=document.getElementById('heading'),qi=document.getElementById('q');
let all=[],mode='grid';
function lcard(i){return el('a',{class:'lcard',href:viewUrl(i)},el('img',{src:i.images[0]||'',alt:i.title,loading:'lazy'}),
  el('div',{},el('h3',{text:i.title}),el('p',{text:i.prompt}),i.keywords.length?el('small',{text:i.keywords.join(' · ')}):null))}
function render(){
  const q=qi.value.trim().toLowerCase();
  const list=all.filter(i=>!q||[i.title,i.prompt,i.sub,...i.keywords].join(' ').toLowerCase().includes(q));
  heading.textContent=cat+' ('+list.length+')';
  content.innerHTML='';
  if(!list.length){content.append(el('div',{class:'msg',text:q?'No results found.':'No prompts in '+cat+' yet.'}));return}
  content.append(mode==='grid'?el('div',{class:'grid'},list.map(card)):el('div',{},list.map(lcard)));
}
function setMode(m){mode=m;vg.classList.toggle('on',m==='grid');vl.classList.toggle('on',m==='list');render()}
const vg=document.getElementById('vg'),vl=document.getElementById('vl');
vg.onclick=()=>setMode('grid');vl.onclick=()=>setMode('list');qi.oninput=render;
if(cat){document.title=cat+' – Ai Edits Ram';
load().then(d=>{all=d;
  const chips=document.getElementById('chips');
  chips.append(el('a',{class:'chip',href:'index.html',text:'Home'}));
  CATEGORIES.forEach(c=>chips.append(el('a',{class:'chip'+(c===cat?' on':''),href:catUrl(c)},c,el('small',{text:d.filter(i=>i.category===c).length}))));
  all=d.filter(i=>i.category===cat);render();
}).catch(e=>{content.innerHTML='';content.append(el('div',{class:'msg',text:'Could not load data/prompts.csv ('+e.message+'). Open the site through GitHub Pages or a local server, not file://.'}))})}
</script></body></html>
