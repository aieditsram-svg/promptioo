<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ai Edits Ram – Gallery</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="wrap">
  <header class="top glass">
    <a class="brand" href="index.html">Ai Edits Ram</a>
    <form class="tools" id="sf" action="index.html"><input type="hidden" name="cat" id="catField"><input type="search" name="q" id="q" placeholder="Search prompts…"><button class="btn ghost" id="shuf" type="button">Shuffle</button></form>
  </header>
  <nav class="chips" id="chips"></nav>
  <h1 id="heading"></h1>
  <main id="content"><div class="msg">Loading…</div></main>
</div>
<script src="assets/app.js"></script>
<script>
const {CATEGORIES,el,load,catUrl,card}=App;
const p=new URLSearchParams(location.search),cat=p.get('cat')||'',q=(p.get('q')||'').trim();
document.getElementById('catField').value=cat;document.getElementById('q').value=q;
if(!cat)document.getElementById('catField').disabled=true;
const content=document.getElementById('content');let list=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function grid(items){return el('div',{class:'grid'},items.map(card))}
function render(){
  content.innerHTML='';
  if(!list.length){content.append(el('div',{class:'msg',text:'No results found.'}));return}
  if(cat||q){content.append(grid(list));return}
  CATEGORIES.forEach(c=>{const items=list.filter(i=>i.category===c);if(!items.length)return;
    content.append(el('h2',{},el('span',{text:c}),el('a',{href:catUrl(c),text:'View all ('+items.length+') →'})),grid(items.slice(0,8)))});
}
load().then(all=>{
  const cats=CATEGORIES;
  const chips=document.getElementById('chips');
  chips.append(el('a',{class:'chip'+(!cat?' on':''),href:'index.html',text:'All'}));
  cats.forEach(c=>chips.append(el('a',{class:'chip'+(c===cat?' on':''),href:catUrl(c)},c,el('small',{text:all.filter(i=>i.category===c).length}))));
  list=all.filter(i=>(!cat||i.category===cat)&&(!q||[i.title,i.prompt,i.category,...i.keywords].join(' ').toLowerCase().includes(q.toLowerCase())));
  document.getElementById('heading').textContent=q?'Results for “'+q+'” ('+list.length+')':(cat?cat+' ('+list.length+')':'All categories');
  document.title=(cat||'Gallery')+' – Ai Edits Ram';
  render();
  document.getElementById('shuf').onclick=()=>{shuffle(list);render()};
}).catch(e=>{content.innerHTML='';content.append(el('div',{class:'msg',text:'Could not load data/prompts.csv ('+e.message+'). Open the site through GitHub Pages or a local server, not file://.'}))});
</script></body></html>
